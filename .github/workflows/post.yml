name: Post football news

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      quiz_now:
        description: "Опублікувати одну пробну вікторину зараз (тест)"
        type: boolean
        default: false
      digest_now:
        description: "Опублікувати пост «Цього дня» зараз (тест)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run history digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-1.5-flash"
          LLM2_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM2_MODEL: "openai/gpt-4o-mini"
          TELEGRAM_CHANNEL: "@football_90_pluss"
          DIGEST_TIME: "09:00"
          DIGEST_ITEMS: "12"
          DIGEST_FORCE: ${{ inputs.digest_now }}
          QUIET_FROM: "21:30"
          QUIET_TO: "07:30"
          RETRY_WINDOW_MIN: "3"
          RETRY_PAUSE_SEC: "60"
        run: python history_today.py

      - name: Run quiz
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-1.5-flash"
          LLM2_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM2_MODEL: "openai/gpt-4o-mini"
          TELEGRAM_CHANNEL: "@football_90_pluss"
          QUIZ_TIME: "19:30"
          QUIZZES_PER_DAY: "6"
          HISTORY_KEEP_DAYS: "730"
          QUIZ_FORCE: ${{ inputs.quiz_now }}
          QUIET_FROM: "21:30"
          QUIET_TO: "07:30"
          RETRY_WINDOW_MIN: "3"
          RETRY_PAUSE_SEC: "60"
        run: python quiz.py

      - name: Run bot
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-1.5-flash"
          LLM2_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          LLM2_MODEL: "openai/gpt-4o-mini"
          TELEGRAM_CHANNEL: "@football_90_pluss"
          USE_SOURCE_IMAGE: "true"
          MAX_PER_RUN: "3"
          POST_INTERVAL_MIN: "20"
          QUIET_FROM: "21:30"
          QUIET_TO: "07:30"
          RETRY_WINDOW_MIN: "3"
          RETRY_PAUSE_SEC: "60"
        run: python post_news.py

      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for f in posted.json quiz_state.json quiz_history.jsonl digest_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to save"
            exit 0
          fi
          git commit -m "update state"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "state saved (attempt $i)"
              exit 0
            fi
            echo "push rejected, syncing and trying again..."
            git pull --rebase -X theirs || git rebase --abort
            sleep 3
          done
          echo "could not save state"
          exit 1
